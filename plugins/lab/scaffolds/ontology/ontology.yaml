# Your ontology.
#
# Rename this file to something meaningful before you finish — it is the schema of your
# organisation's knowledge, not a lab exercise artifact.
#
# ONE RULE, and everything else follows from it: **derive this from the questions you have
# to answer, never from the data you happen to have.** Modelling the data gives you a
# database schema with extra steps. Modelling the questions gives you the smallest graph
# that answers them, which is the only kind anybody maintains.
#
# Aim for 6-10 types and 8-12 relations. If you are past that, you are modelling the data.

