# ---------------------------------------------------------------- competency questions
# These are the three questions your retrieval could not answer, carried over from the last
# module. They are the specification. When you are deciding whether a type belongs, the
# test is: which of these three needs it?

competency_questions:
  - id: CQ1
    q: "{{CQ_MULTI_HOP}}"
    shape: multi-hop
    needs: |
      TODO — write the traversal in words before you write any YAML. Something like:
      "start at X, follow relation A to Y, then relation B backwards to Z, then compare
      a property of Z against a property of X."

      Do this first and properly. It is how you discover which relations you need, and
      which direction each one has to point. Skipping it is how people end up with a
      tidy graph that cannot answer the question it was built for.
  - id: CQ2
    q: "{{CQ_AGGREGATION}}"
    shape: aggregation
    needs: |
      TODO — this one is about a COMPLETE set, or about absence. Ask yourself what would
      have to be true for the answer to be trustworthy: which type are you counting, and
      what makes a member of that type count?
  - id: CQ3
    q: "{{CQ_TEMPORAL}}"
    shape: temporal
    needs: |
      TODO — which single fact in this question changes over time? That fact becomes a
      relation with `temporal: true`, and the answer is only correct as of a date.

# ---------------------------------------------------------------- types
# key    what makes two mentions the same thing. This is entity resolution, and it is a
#        decision, not a lookup: "Brightmoor Health" and "Brightmoor Health Ltd" are the
#        same customer or they are not, and you have to say which.
# props  facts about the thing itself. Never facts about its relationships — those are edges.
# source where instances come from. Write it down; provenance is what makes an answer usable.

types:
