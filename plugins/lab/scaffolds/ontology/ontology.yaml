# ---------------------------------------------------------------- relations
# Read every relation aloud as a sentence: "Account on_plan Plan." If it does not read as
# one, the direction is probably wrong — and a backwards edge does not error, it just
# answers questions incorrectly.
#
# cardinality  many-to-one, one-to-one, many-to-many. The compiler uses it to catch two
#              values where there should be one.
# temporal     true if this relation's truth changes over time. Then every edge carries
#              valid_from / valid_to, and a closed edge is kept, never overwritten. An
#              overwritten fact is a question you can no longer answer.

